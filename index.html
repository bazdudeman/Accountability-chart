<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accountability chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<style>
  :root {
    --paper: #f7f8fa;
    --card: #ffffff;
    --ink: #1c2733;
    --muted: #5b6876;
    --line: #a9b4bf;
    --edge: #d5dbe1;
    --steel: #3d5a73;
    --steel-soft: #e6edf3;
    --error: #a3271c;
    --error-soft: #fbeceb;
    --w: 216px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #151b22;
      --card: #1e2731;
      --ink: #e6ebf0;
      --muted: #9aa7b4;
      --line: #4d5b69;
      --edge: #33404d;
      --steel: #8fb3d1;
      --steel-soft: #23313f;
      --error: #f2a39b;
      --error-soft: #3a1f1d;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 14px/1.45 "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px 24px;
    padding: 24px 28px 8px;
  }
  h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
  .sub { margin: 2px 0 0; color: var(--muted); }
  .tools { display: flex; gap: 8px; }
  button {
    font: inherit;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--edge);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--line); }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--steel); outline-offset: 2px; }
  select {
    font: inherit;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--edge);
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
  }
  .picker[hidden] { display: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  #errors {
    margin: 12px 28px 0;
    padding: 12px 16px;
    border: 1px solid var(--error);
    border-radius: 6px;
    background: var(--error-soft);
    color: var(--error);
  }
  #errors ul { margin: 6px 0 0; padding-left: 18px; }
  #errors[hidden] { display: none; }

  .scroll { overflow-x: auto; padding: 16px 28px 48px; }
  #chart { display: flex; justify-content: center; min-width: max-content; }

  /* Tree: seats with their own teams spread left to right */
  ul { list-style: none; margin: 0; padding: 0; }
  .row { display: flex; justify-content: center; position: relative; padding-top: 22px; }
  .row > li {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 22px 8px 0;
  }
  .row > li::before, .row > li::after {
    content: "";
    position: absolute;
    top: 0;
    width: 50%;
    height: 22px;
    border-top: 1px solid var(--line);
  }
  .row > li::before { right: 50%; }
  .row > li::after { left: 50%; border-left: 1px solid var(--line); }
  .row > li:first-child::before, .row > li:last-child::after { border: 0; }
  .row > li:last-child::before { border-right: 1px solid var(--line); border-top-right-radius: 4px; }
  .row > li:first-child::after { border-top-left-radius: 4px; }
  .row > li:only-child { padding-top: 0; }
  .row > li:only-child::before, .row > li:only-child::after { display: none; }
  li > .row::before {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    height: 22px;
    border-left: 1px solid var(--line);
  }
  #chart > .row { padding-top: 0; }

  /* Stack: seats whose team members have no reports of their own */
  .stack { position: relative; width: var(--w); padding-left: 18px; }
  .stack > li { position: relative; margin-top: 10px; }
  .stack > li::before {
    content: "";
    position: absolute;
    left: -10px;
    top: -10px;
    bottom: 0;
    border-left: 1px solid var(--line);
  }
  .stack > li:last-child::before { bottom: auto; height: 32px; }
  .stack > li::after {
    content: "";
    position: absolute;
    left: -10px;
    top: 22px;
    width: 10px;
    border-top: 1px solid var(--line);
  }

  .card {
    width: var(--w);
    background: var(--card);
    border: 1px solid var(--edge);
    border-radius: 6px;
    padding: 10px 12px 11px;
    text-align: left;
  }
  .stack .card { width: 100%; }
  .card.lead { border-top: 3px solid var(--steel); }
  .card h2 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.3; }
  .who { margin: 2px 0 0; color: var(--muted); }
  .who.open { font-style: italic; }
  .roles {
    margin: 8px 0 0;
    padding: 8px 0 0 16px;
    border-top: 1px solid var(--edge);
    color: var(--muted);
    font-size: 12.5px;
    list-style: disc;
  }
  .roles li { margin: 1px 0; }
  .depth-0, .depth-1 { background: var(--steel-soft); }
  body.hide-roles .roles { display: none; }

  @media print {
    @page { size: landscape; margin: 10mm; }
    body { background: #fff; }
    .tools, #errors { display: none; }
    .scroll { overflow: visible; padding: 0; }
    .card { break-inside: avoid; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="title">Accountability chart</h1>
    <p class="sub" id="sub">Loading chart</p>
  </div>
  <div class="tools">
    <label class="picker" id="picker" hidden>
      <span class="sr-only">Chart version</span>
      <select id="version"></select>
    </label>
    <button type="button" id="toggle-roles" aria-pressed="true">Hide roles</button>
    <button type="button" onclick="window.print()">Print or save PDF</button>
  </div>
</header>
<div id="errors" role="alert" hidden></div>
<div class="scroll"><div id="chart"></div></div>

<script>
(function () {
  const chartEl = document.getElementById("chart");
  const errorsEl = document.getElementById("errors");

  function showErrors(title, list) {
    errorsEl.hidden = false;
    errorsEl.innerHTML = "";
    const strong = document.createElement("strong");
    strong.textContent = title;
    errorsEl.appendChild(strong);
    if (list && list.length) {
      const ul = document.createElement("ul");
      list.forEach(function (msg) {
        const li = document.createElement("li");
        li.textContent = msg;
        ul.appendChild(li);
      });
      errorsEl.appendChild(ul);
    }
  }

  function formatDate(value) {
    if (value instanceof Date) return value.toISOString().slice(0, 10);
    return value ? String(value) : "";
  }

  function check(seats) {
    const problems = [];
    const ids = new Set();
    seats.forEach(function (s, i) {
      const label = s && s.seat ? '"' + s.seat + '"' : "seat #" + (i + 1);
      if (!s || !s.id) { problems.push(label + " has no id."); return; }
      if (ids.has(s.id)) problems.push('The id "' + s.id + '" is used more than once.');
      ids.add(s.id);
      if (!s.seat) problems.push('The seat with id "' + s.id + '" has no seat title.');
      if (s.roles && !Array.isArray(s.roles)) problems.push(label + ": roles must be a list, each line starting with a dash.");
      if (Array.isArray(s.roles) && s.roles.length > 5) problems.push(label + " has " + s.roles.length + " roles. EOS recommends five or fewer.");
    });
    seats.forEach(function (s) {
      if (s && s.reports_to && !ids.has(s.reports_to)) {
        problems.push('"' + s.seat + '" reports to "' + s.reports_to + '", but no seat has that id.');
      }
    });
    const byId = {};
    seats.forEach(function (s) { if (s && s.id) byId[s.id] = s; });
    seats.forEach(function (s) {
      const seen = new Set();
      let cur = s;
      while (cur && cur.reports_to) {
        if (seen.has(cur.id)) { problems.push('"' + s.seat + '" is part of a reporting loop.'); break; }
        seen.add(cur.id);
        cur = byId[cur.reports_to];
      }
    });
    return problems;
  }

  function card(seat, depth) {
    const div = document.createElement("div");
    div.className = "card depth-" + Math.min(depth, 2) + (depth === 2 ? " lead" : "");
    const h = document.createElement("h2");
    h.textContent = seat.seat;
    div.appendChild(h);
    const who = document.createElement("p");
    const name = seat.name ? String(seat.name).trim() : "";
    who.className = "who" + (name ? "" : " open");
    who.textContent = name || "Open seat";
    div.appendChild(who);
    if (Array.isArray(seat.roles) && seat.roles.length) {
      const ul = document.createElement("ul");
      ul.className = "roles";
      seat.roles.forEach(function (r) {
        const li = document.createElement("li");
        li.textContent = r;
        ul.appendChild(li);
      });
      div.appendChild(ul);
    }
    return div;
  }

  function build(seat, kids, depth) {
    const li = document.createElement("li");
    li.appendChild(card(seat, depth));
    const children = kids[seat.id] || [];
    if (children.length) {
      const allLeaves = children.every(function (c) { return !(kids[c.id] || []).length; });
      const ul = document.createElement("ul");
      ul.className = allLeaves && depth >= 1 ? "stack" : "row";
      children.forEach(function (c) { ul.appendChild(build(c, kids, depth + 1)); });
      li.appendChild(ul);
    }
    return li;
  }

  function render(data) {
    const seats = (data && data.seats) || [];
    document.getElementById("title").textContent = (data.company ? data.company + " " : "") + "accountability chart";
    document.title = document.getElementById("title").textContent;
    const updated = formatDate(data.updated);
    document.getElementById("sub").textContent = updated ? "Updated " + updated : "";

    const problems = check(seats);
    if (problems.length) showErrors("Fix these in " + fileName + ":", problems);

    const kids = {};
    const roots = [];
    seats.forEach(function (s) {
      if (!s || !s.id) return;
      if (s.reports_to) (kids[s.reports_to] = kids[s.reports_to] || []).push(s);
      else roots.push(s);
    });
    const top = document.createElement("ul");
    top.className = "row";
    roots.forEach(function (r) { top.appendChild(build(r, kids, 0)); });
    chartEl.innerHTML = "";
    chartEl.appendChild(top);
  }

  // Which version to show: index.html?v=chart-2027-draft loads chart-2027-draft.yaml
  const requested = new URLSearchParams(location.search).get("v") || "chart";
  const current = /^[A-Za-z0-9_-]+$/.test(requested) ? requested : "chart";
  const fileName = current + ".yaml";

  // Optional menu of versions, listed in versions.yaml
  fetch("versions.yaml", { cache: "no-store" })
    .then(function (res) { return res.ok ? res.text() : null; })
    .then(function (text) {
      if (!text) return;
      const list = ((jsyaml.load(text) || {}).versions || []).filter(function (v) {
        return v && v.file && /^[A-Za-z0-9_-]+$/.test(v.file);
      });
      if (!list.length) return;
      const select = document.getElementById("version");
      list.forEach(function (v) {
        const opt = document.createElement("option");
        opt.value = v.file;
        opt.textContent = v.label || v.file;
        if (v.file === current) opt.selected = true;
        select.appendChild(opt);
      });
      if (!list.some(function (v) { return v.file === current; })) {
        const opt = document.createElement("option");
        opt.value = current;
        opt.textContent = current;
        opt.selected = true;
        select.appendChild(opt);
      }
      select.addEventListener("change", function () {
        const url = new URL(location.href);
        if (select.value === "chart") url.searchParams.delete("v");
        else url.searchParams.set("v", select.value);
        location.href = url.toString();
      });
      document.getElementById("picker").hidden = false;
    })
    .catch(function () { /* the menu is optional */ });

  fetch(fileName, { cache: "no-store" })
    .then(function (res) {
      if (!res.ok) throw new Error(fileName + " was not found next to index.html (HTTP " + res.status + ").");
      return res.text();
    })
    .then(function (text) {
      let data;
      try { data = jsyaml.load(text); }
      catch (e) {
        showErrors(fileName + " has a formatting problem. Check indentation near line " +
          (e.mark ? e.mark.line + 1 : "?") + ".", [e.reason || e.message]);
        return;
      }
      render(data || {});
    })
    .catch(function (e) {
      document.getElementById("sub").textContent = "";
      showErrors("The chart could not load.", [
        e.message,
        "If you opened this file straight from your computer, run it through a web server or view it on GitHub Pages."
      ]);
    });

  const toggle = document.getElementById("toggle-roles");
  toggle.addEventListener("click", function () {
    const hidden = document.body.classList.toggle("hide-roles");
    toggle.textContent = hidden ? "Show roles" : "Hide roles";
    toggle.setAttribute("aria-pressed", String(!hidden));
  });
})();
</script>
</body>
</html>
