# Titan Fittings Accountability Chart
#
# Edit this file to change the chart. Save (commit) it on GitHub and the
# website rebuilds itself within about a minute.
#
# Each seat has:
#   id          short unique name, lowercase, no spaces (use dashes)
#   seat        the seat title shown on the chart
#   name        the person in the seat (leave "" for an open seat)
#   reports_to  the id of the seat above it (leave out for the top seat)
#   roles       up to five key roles
#
# To move a seat, change its reports_to. To add a seat, copy a block.
# Seats appear left to right in the order they are listed here.

company: Titan Fittings
updated: 2026-11-10

seats:
  - id: visionary
    seat: Visionary
    name: ""
    roles:
      - 1, 3, 10-year vision
      - Big ideas and innovation
      - Top customer relationships
      - Top vendor relationships
      - Culture

  - id: integrator
    seat: Integrator
    name: ""
    reports_to: visionary
    roles:
      - Lead, manage, hold accountable
      - Run L10, scorecard, rocks
      - P&L and profitability
      - Resolve cross-department issues
      - Execute the business plan

  # ---------- Sales ----------
